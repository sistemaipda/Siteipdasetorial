<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Lista de Presença</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.topo{
    background:#0d47a1;
    color:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:8px;
    border:1px solid #ccc;
}

.switch{
    position:relative;
    display:inline-block;
    width:55px;
    height:28px;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    cursor:pointer;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:#c62828;
    transition:.3s;
    border-radius:34px;
}

.slider:before{
    position:absolute;
    content:"";
    height:22px;
    width:22px;
    left:3px;
    bottom:3px;
    background:white;
    transition:.3s;
    border-radius:50%;
}

input:checked + .slider{
    background:#2e7d32;
}

input:checked + .slider:before{
    transform:translateX(26px);
}

.fechado{
    background:#c62828;
    color:white;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

</style>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

</head>
<body>

<div class="topo">
    <h2 id="evento"></h2>
    <div id="data"></div>
</div>

<input
type="text"
placeholder="Pesquisar membro..."
id="pesquisa"
onkeyup="filtrar()"
>

<div id="status"></div>

<div id="lista"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyC5Ylv9RyBfZ3BN5IgDWGqrldQR9yIbFRA",
  authDomain: "ipda-setorial-contagem.firebaseapp.com",
  databaseURL: "https://ipda-setorial-contagem-default-rtdb.firebaseio.com",
  projectId: "ipda-setorial-contagem",
  storageBucket: "ipda-setorial-contagem.appspot.com",
  messagingSenderId: "815344482867",
  appId: "1:815344482867:web:221f5624f89c1e25468146"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const params = new URLSearchParams(location.search);

const id = params.get("id");

db.ref("listaTempoReal/" + id).on("value", snapshot => {

    let dados = snapshot.val();

    if(!dados) return;

    document.getElementById("evento").innerText =
        dados.evento;

    document.getElementById("data").innerText =
        dados.data;

    if(dados.fechada){

        document.getElementById("status").innerHTML =
        `<div class="fechado">
            Lista encerrada
        </div>`;

    } else {

        document.getElementById("status").innerHTML = "";

    }

    let html = "";

    Object.keys(dados.membros).forEach(nome => {

        let membro = dados.membros[nome];

        html += `
        <div class="card membro-item">

            <span>${nome}</span>

            <label class="switch">

                <input
                    type="checkbox"
                    ${membro.presente ? "checked" : ""}
                    ${dados.fechada ? "disabled" : ""}
                    onchange="marcar('${nome}', this.checked)"
                >

                <span class="slider"></span>

            </label>

        </div>
        `;
    });

    document.getElementById("lista").innerHTML = html;

});

function marcar(nome, valor){

    db.ref(
        "listaTempoReal/" +
        id +
        "/membros/" +
        nome +
        "/presente"
    ).set(valor);

}

function filtrar(){

    let filtro =
        document.getElementById("pesquisa")
        .value.toLowerCase();

    let itens =
        document.querySelectorAll(".membro-item");

    itens.forEach(item => {

        let nome =
            item.innerText.toLowerCase();

        item.style.display =
            nome.includes(filtro)
            ? ""
            : "none";

    });

}

</script>

</body>
</html>
